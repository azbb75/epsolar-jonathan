; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
env_default = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
build_flags = -DHARDWARE_V2
lib_deps = 
 ESP Async WebServer
 ESPAsyncWiFiManager
 ModbusMaster
 SimpleTimer
 Sqlite3 for ESP8266
 SdFat
 SPI

extra_scripts = extra_script.py

[env:nodemcuv2-nogulp]
platform = espressif8266
board = nodemcuv2
framework = arduino
build_flags = -DHARDWARE_V2
lib_deps = 
 ESP Async WebServer
 ESPAsyncWiFiManager
 ModbusMaster
 SimpleTimer
 Sqlite3 for ESP8266
 SdFat
 SPI



[env:nodemcuv2-SIMULATOR]
platform = espressif8266
board = nodemcuv2
framework = arduino
build_flags = -DSIMULATOR -DHARDWARE_V2
lib_deps = 
 ESP Async WebServer
 ESPAsyncWiFiManager
 ModbusMaster
 SimpleTimer
 Sqlite3 for ESP8266
 SdFat
 SPI

extra_scripts = extra_script.py


